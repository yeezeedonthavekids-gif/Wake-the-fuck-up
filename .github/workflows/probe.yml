name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: AlarmKit interface
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          F=$(find "$SDK/System/Library/Frameworks/AlarmKit.framework" -name "arm64e-apple-ios.swiftinterface" | head -1)
          echo "$F"
          grep -E "^\s*(public|@available|  (public )?(init|func|var|case|static))|struct |enum |protocol |class |extension " "$F" | grep -v "^\s*@_" | head -400
      - name: AlertSound
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          F=$(find "$SDK/System/Library/Frameworks/ActivityKit.framework" -name "arm64e-apple-ios.swiftinterface" | head -1)
          grep -n -A12 "struct AlertSound" "$F" | head -40
