name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 gen_sounds.py && brew install xcodegen && xcodegen generate
      - run: xcodebuild -project WakeUp.xcodeproj -target WakeUp -sdk iphoneos -configuration Release SYMROOT=$PWD/build CODE_SIGNING_ALLOWED=NO build
      - run: mkdir Payload && cp -R build/Release-iphoneos/WakeUp.app Payload/ && zip -r WakeUp.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WakeUp-ipa
          path: WakeUp.ipa
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: WakeUp.ipa
          make_latest: true
