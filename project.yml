name: WakeUp
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  WakeUp:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: WakeUp
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMotionUsageDescription: Shake to prove you're awake.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wakeup.alarm
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
